apiVersion: v1
kind: ConfigMap
metadata:
  name: llama2-router-config
data:
  workers.yaml: |
    listen: 0.0.0.0:8081
    health_interval_ms: 2000
    workers:
      - http://llama2-worker-0.llama2-workers:8080
      - http://llama2-worker-1.llama2-workers:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama2-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama2-router
  template:
    metadata:
      labels:
        app: llama2-router
    spec:
      containers:
        - name: router
          image: llama2-router:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/llama2-router
      volumes:
        - name: config
          configMap:
            name: llama2-router-config
---
apiVersion: v1
kind: Service
metadata:
  name: llama2-router
spec:
  type: NodePort
  selector:
    app: llama2-router
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30081
