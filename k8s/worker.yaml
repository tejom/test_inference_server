apiVersion: v1
kind: Service
metadata:
  name: llama2-workers
spec:
  clusterIP: None
  selector:
    app: llama2-worker
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llama2-worker
spec:
  serviceName: llama2-workers
  replicas: 2
  selector:
    matchLabels:
      app: llama2-worker
  template:
    metadata:
      labels:
        app: llama2-worker
    spec:
      containers:
        - name: worker
          image: llama2-worker:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
