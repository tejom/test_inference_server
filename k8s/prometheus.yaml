apiVersion: v1
kind: ConfigMap
metadata:
  name: llama2-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: llama2-workers
        static_configs:
          - targets:
              - llama2-worker-0.llama2-workers:8080
              - llama2-worker-1.llama2-workers:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama2-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama2-prometheus
  template:
    metadata:
      labels:
        app: llama2-prometheus
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          ports:
            - containerPort: 9090
              name: http
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: llama2-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llama2-prometheus
spec:
  selector:
    app: llama2-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
